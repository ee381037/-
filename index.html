<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>116 學年度研究所簡章跨校查詢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #fafafa;
      color: #18181b;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    .gew-badge-school { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
    .s-ntu { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .s-nthu { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
    .s-nycu { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
    .s-nsysu { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .gew-sub-tag { display: inline-block; padding: 3px 8px; margin: 2px; font-size: 12px; background: #f4f4f5; color: #3f3f46; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .gew-sub-tag:hover { background: #e4e4e7; color: #18181b; }
  </style>
</head>
<body class="p-4 sm:p-8">

  <div class="max-w-7xl mx-auto bg-white border border-zinc-200 rounded-xl shadow-sm overflow-hidden">
    
    <!-- 頂部標題與篩選器 -->
    <div class="p-5 border-b border-zinc-100 bg-zinc-50/50">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 text-white flex items-center justify-center font-semibold text-sm">116</div>
        <div>
          <h1 class="text-lg font-bold text-zinc-900 leading-tight">研究所簡章查詢系統</h1>
          <p class="text-xs text-zinc-500 mt-0.5" id="statusText">正在連線取得最新簡章資料...</p>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-3">
        <!-- 搜尋列 -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="搜尋系所、代碼或考科（例：資工、資料結構、經濟學）..." 
            class="w-full pl-9 pr-9 py-2.5 bg-white border border-zinc-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-zinc-800 transition"
            oninput="renderTable()"
          >
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-700">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>

        <!-- 領域篩選 -->
        <select id="catSelect" onchange="renderTable()" class="px-3 py-2.5 bg-white border border-zinc-300 rounded-lg text-sm font-medium text-zinc-700 focus:outline-none focus:ring-2 focus:ring-zinc-800">
          <option value="ALL">所有領域學群</option>
          <option value="電資">電資 (資工/電機/資安/AI)</option>
          <option value="理工">理工 (機械/材料/化工/數理)</option>
          <option value="商管">商管 (企管/資管/財金/經研)</option>
          <option value="文社法">文社法 (傳播/心輔/法律)</option>
          <option value="生醫農">生醫衛農 (生科/藥學/公衛/醫工)</option>
        </select>

        <!-- 考試型態篩選 -->
        <select id="modeSelect" onchange="renderTable()" class="px-3 py-2.5 bg-white border border-zinc-300 rounded-lg text-sm font-medium text-zinc-700 focus:outline-none focus:ring-2 focus:ring-zinc-800">
          <option value="ALL">全部考試方式</option>
          <option value="WRITTEN">需筆試</option>
          <option value="DOC_ONLY">免筆試 (純書審/口試)</option>
        </select>
      </div>

      <!-- 學校快篩按鈕 -->
      <div class="mt-4 flex flex-wrap gap-2 text-sm text-zinc-600 items-center">
        <span class="font-medium mr-1">學校篩選：</span>
        <button onclick="setSchool('ALL', this)" class="school-btn px-3 py-1 bg-zinc-900 text-white rounded-md font-medium transition">全部</button>
        <button onclick="setSchool('台大', this)" class="school-btn px-3 py-1 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-md font-medium transition">台大</button>
        <button onclick="setSchool('清大', this)" class="school-btn px-3 py-1 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-md font-medium transition">清大</button>
        <button onclick="setSchool('陽明交大', this)" class="school-btn px-3 py-1 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-md font-medium transition">陽明交大</button>
        <button onclick="setSchool('中山', this)" class="school-btn px-3 py-1 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-md font-medium transition">中山</button>
      </div>
    </div>

    <!-- 表格區塊 -->
    <div class="overflow-x-auto custom-scrollbar max-h-[600px]">
      <table class="w-full text-left border-collapse">
        <thead class="sticky top-0 bg-white shadow-sm z-10">
          <tr class="text-[12px] font-semibold text-zinc-500 uppercase tracking-wider border-b border-zinc-200">
            <th class="py-3 px-4 w-24">學校</th>
            <th class="py-3 px-4 w-24">學群</th>
            <th class="py-3 px-4 min-w-[200px]">系所與組別</th>
            <th class="py-3 px-4 w-16">名額</th>
            <th class="py-3 px-4 min-w-[300px]">考試科目 (點擊快速搜尋)</th>
            <th class="py-3 px-4 w-32">筆試日期</th>
            <th class="py-3 px-4 w-32">複試日期</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-zinc-100 text-sm"></tbody>
      </table>
    </div>
    
    <!-- 空白狀態提示 -->
    <div id="emptyState" class="hidden py-16 text-center text-zinc-400 bg-white">
      <i class="fa-solid fa-folder-open text-3xl mb-3 text-zinc-300"></i>
      <p class="text-sm">找不到符合條件的系所，請嘗試其他關鍵字。</p>
    </div>
  </div>

  <script>
    let DB = [];
    let activeSchool = 'ALL';

    // 非同步抓取獨立的 JSON 資料檔
    fetch('./data.json')
      .then(response => {
        if (!response.ok) throw new Error('找不到 data.json 檔案');
        return response.json();
      })
      .then(data => {
        DB = data;
        document.getElementById('statusText').innerHTML = `<span class="text-emerald-600 font-medium"><i class="fa-solid fa-check mr-1"></i>資料載入完成 (共 ${DB.length} 筆)</span>`;
        renderTable();
      })
      .catch(error => {
        console.error('Error fetching data:', error);
        document.getElementById('statusText').innerHTML = `<span class="text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>資料載入失敗，請確認 data.json 是否已上傳至 GitHub 儲存庫。</span>`;
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('emptyState').innerHTML = `<p class="text-red-500">無法讀取資料庫 (data.json)。</p>`;
      });

    // 學校標籤顏色對應
    function getSchoolBadgeClass(school) {
      if (school === '台大') return 's-ntu';
      if (school === '清大') return 's-nthu';
      if (school === '陽明交大') return 's-nycu';
      if (school === '中山') return 's-nsysu';
      return 'bg-zinc-100 text-zinc-700 border-zinc-200';
    }

    // 學校篩選按鈕邏輯
    function setSchool(school, btnEl) {
      activeSchool = school;
      document.querySelectorAll('.school-btn').forEach(b => {
        b.className = "school-btn px-3 py-1 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-md font-medium transition";
      });
      btnEl.className = "school-btn px-3 py-1 bg-zinc-900 text-white rounded-md font-medium transition";
      renderTable();
    }

    // 搜尋框邏輯
    function quickSearch(kw) {
      document.getElementById('searchInput').value = kw;
      renderTable();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderTable();
    }

    // 渲染表格
    function renderTable() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const mode = document.getElementById('modeSelect').value;
      const cat = document.getElementById('catSelect').value;
      
      document.getElementById('clearSearchBtn').classList.toggle('hidden', q.length === 0);

      const filtered = DB.filter(row => {
        if (activeSchool !== 'ALL' && row.school !== activeSchool) return false;
        if (cat !== 'ALL' && row.cat !== cat) return false;
        if (mode === 'WRITTEN' && row.exam_date === '免筆試') return false;
        if (mode === 'DOC_ONLY' && row.exam_date !== '免筆試') return false;
        if (!q) return true;
        
        return (
          row.school.toLowerCase().includes(q) ||
          row.dept.toLowerCase().includes(q) ||
          row.group.toLowerCase().includes(q) ||
          (row.code && row.code.toLowerCase().includes(q)) ||
          row.subjects.some(sub => sub.toLowerCase().includes(q))
        );
      });

      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(item => {
        const subjectTags = item.subjects.map(sub => {
          const clean = sub.replace(/\(.*?\)|加權.*?%|選考.*?:/g, '').trim();
          return `<button type="button" onclick="quickSearch('${clean}')" class="gew-sub-tag">${sub}</button>`;
        }).join('');

        const tr = document.createElement('tr');
        tr.className = "hover:bg-zinc-50 transition";
        tr.innerHTML = `
          <td class="py-3 px-4 align-top"><span class="gew-badge-school ${getSchoolBadgeClass(item.school)}">${item.school}</span></td>
          <td class="py-3 px-4 align-top text-xs text-zinc-500 font-medium">${item.cat || '-'}</td>
          <td class="py-3 px-4 align-top">
            <div class="font-semibold text-zinc-900">${item.dept}</div>
            <div class="text-xs text-zinc-500 mt-1">${item.group} ${item.code ? `<span class="text-zinc-300 ml-1">#${item.code}</span>` : ''}</div>
          </td>
          <td class="py-3 px-4 align-top font-mono text-zinc-600">${item.quota}</td>
          <td class="py-3 px-4 align-top"><div class="flex flex-wrap -m-0.5">${subjectTags}</div></td>
          <td class="py-3 px-4 align-top text-xs font-mono ${item.exam_date === '免筆試' ? 'text-emerald-600 font-medium' : 'text-zinc-800'}">${item.exam_date}</td>
          <td class="py-3 px-4 align-top text-xs font-mono text-zinc-500">${item.interview_date || '免口試'}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
